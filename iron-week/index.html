<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Week Log</title>
<meta name="theme-color" content="#2747c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Week">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky day strip on top, one column of exercise cards with set rows like a gym logbook */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18202a; --muted:#5d6876; --line:#d5dbe2;
  --accent:#2747c9; --accent-ink:#ffffff; --done:#1f8a55; --done-bg:#e3f4ea; --soft:#e4e9f7;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"Work Sans",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151b; --panel:#1a2029; --ink:#e7ecf2; --muted:#93a0b0; --line:#2b3440;
  --accent:#7c95ff; --accent-ink:#0d1220; --done:#5fd197; --done-bg:#183326; --soft:#222b40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --panel:#1a2029; --ink:#e7ecf2; --muted:#93a0b0; --line:#2b3440;
  --accent:#7c95ff; --accent-ink:#0d1220; --done:#5fd197; --done-bg:#183326; --soft:#222b40; color-scheme:dark}
*{box-sizing:border-box}\nhtml,body{margin:0}\n:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nbody{font-size:15px}\n[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .wrap{padding-block:14px 10px;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.unit{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.unit button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:6px 12px;cursor:pointer}
.unit button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:6px 2px;cursor:pointer;display:grid;gap:1px;text-align:center}
.day b{font-family:var(--f-display);font-size:16px;letter-spacing:.04em}
.day span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-current="true"] span{color:var(--accent-ink);opacity:.85}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.focus{padding-block:22px 6px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.focus h2{font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
.focus p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:18px}
.stat{display:grid}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat strong{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:6px;padding:8px 10px;margin:12px 0 4px}
.list{display:grid;gap:12px;margin-top:12px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.exhead h3{margin:0;font-size:16px;font-weight:600}
.target{font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.last{font-size:12.5px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:500;padding:0 6px 4px}
td{padding:4px 6px;border-top:1px solid var(--line)}
td.n{font-family:var(--f-num);color:var(--muted);width:36px}
input[type=number]{width:100%;max-width:110px;font:500 15px var(--f-num);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
.chk{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
tr.done .chk{background:var(--done);border-color:var(--done);color:#fff}
tr.done td{background:var(--done-bg)}
.row-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);font:500 13px var(--f-body);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{color:var(--muted)}
.rest{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted)}
.rest h3{color:var(--ink);margin:0 0 6px;font-family:var(--f-display);text-transform:uppercase;font-size:22px}
.add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.add input{flex:1 1 180px;min-width:0;font:15px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.add input.sm{flex:0 0 80px;font-family:var(--f-num)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px}
@media (max-width:460px){.day span{display:none}.focus h2{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.ex{transition:border-color .15s}}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="top">
    <h1>Iron Week</h1>
    <div class="unit" role="group" aria-label="Weight unit">
      <button id="u-lb" aria-pressed="true">lb</button><button id="u-kg" aria-pressed="false">kg</button>
    </div>
  </div>
  <nav class="days" id="days" aria-label="Days"></nav>
</div></header>

<main class="wrap">
  <section class="focus">
    <div><h2 id="title"></h2><p id="sub"></p></div>
    <div class="stats">
      <div class="stat"><small>Sets done</small><strong id="s-sets">0/0</strong></div>
      <div class="stat"><small>Volume</small><strong id="s-vol">0</strong></div>
    </div>
  </section>
  <div class="note" id="note"><strong>A1/A2 = superset:</strong> do one set of each, then rest. Warm up with 1-2 light sets of the first lift. Rest 60-90 sec (2 min on big lifts). Stop 1-3 reps short of failure, and add 2.5-5 lb once you hit the top of the range on every set. Your log saves in this browser.</div>
  <div class="list" id="list"></div>
  <form class="add" id="addform">
    <input id="add-name" placeholder="Add exercise (e.g. Face Pulls)" aria-label="Exercise name" required>
    <input id="add-sets" class="sm" type="number" min="1" max="10" value="3" aria-label="Sets">
    <input id="add-reps" class="sm" placeholder="8-12" value="10" aria-label="Target reps">
    <button class="btn primary" type="submit">Add</button>
  </form>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const PLAN=[
 {d:"Mon",name:"Push",sub:"Chest · Shoulders · Triceps",ex:[["Bench Press (BB or DB)",4,"6-8"],["Seated DB Shoulder Press",3,"8-10"],["A1. Incline DB Press",3,"10-12"],["A2. Lateral Raise",3,"12-15"],["Triceps Rope Pushdown",3,"10-15"]]},
 {d:"Tue",name:"Legs A",sub:"Quads",ex:[["Leg Press",4,"8-12"],["Bulgarian Split Squat (DB)",3,"8-10/leg"],["A1. Leg Extension",3,"12-15"],["A2. Standing Calf Raise",3,"12-15"],["Hanging Knee Raise / Cable Crunch",3,"10-15"]]},
 {d:"Wed",name:"Pull",sub:"Back · Biceps",ex:[["Pull-Up / Lat Pulldown",4,"6-10"],["Chest-Supported Row",4,"8-10"],["A1. Single-Arm Row",3,"10-12"],["A2. Face Pull",3,"15"],["Incline DB Curl",3,"10-12"]]},
 {d:"Thu",name:"Delts & Arms",sub:"Shoulders · Arms · Core",ex:[["Arnold Press",3,"8-10"],["A1. Cable Lateral Raise",3,"12-15"],["A2. Reverse Pec Deck",3,"12-15"],["B1. EZ-Bar Curl",3,"8-12"],["B2. Overhead Triceps Extension",3,"10-12"],["Plank (sec)",3,"30-60"],["Pallof Press",2,"10-12/side"]]},
 {d:"Fri",name:"Legs B",sub:"Glutes · Hamstrings",ex:[["Barbell Hip Thrust",4,"8-12"],["Lying / Seated Leg Curl",3,"10-12"],["A1. Walking Lunge / Step-Up",3,"10/leg"],["A2. Seated Calf Raise",3,"12-15"],["Back Extension",2,"12-15"]]},
 {d:"Sat",name:"Upper",sub:"Upper body volume",ex:[["A1. Incline Press (BB or machine)",3,"8-10"],["A2. Seated Cable Row",3,"8-10"],["B1. DB Lateral Raise",3,"12-15"],["B2. Lat Pulldown (neutral)",3,"10-12"],["C1. Cable Curl",2,"12-15"],["C2. Triceps Pushdown",2,"12-15"]]},
 {d:"Sun",name:"Light Day",sub:"Full body recovery pump · ~60% of normal weights",ex:[["Goblet Squat",3,"10-12"],["Push-Up / Machine Chest Press",3,"12-15"],["One-Arm DB Row",3,"12"],["Glute Bridge",3,"15"],["Side Plank (sec/side)",2,"30"],["Stretching / Mobility (min)",1,"5"]]}
];
const KEY="ironweek-v3";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fresh(){
  return {unit:"lb",day:(new Date().getDay()+6)%7,
    days:PLAN.map(p=>({ex:p.ex.map(([n,s,r,w])=>({name:n,target:r,last:w?`${w} × ${String(r).split("-")[0]}`:"",sets:Array.from({length:s},()=>({w:w||"",r:String(r).match(/^\d+/)?.[0]||"",done:false}))}))}))};
}
let S=load()||fresh();
const $=id=>document.getElementById(id);
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}

function renderDays(){
  $("days").innerHTML=PLAN.map((p,i)=>`<button class="day" data-i="${i}" aria-current="${i===S.day}"><b>${p.d}</b><span>${p.name}</span></button>`).join("");
}
function stats(){
  const d=S.days[S.day];let n=0,t=0,v=0;
  d.ex.forEach(e=>e.sets.forEach(s=>{t++;if(s.done){n++;v+=(+s.w||0)*(+s.r||0)}}));
  $("s-sets").textContent=`${n}/${t}`;$("s-vol").textContent=`${v.toLocaleString()} ${S.unit}`;
}
function render(){
  renderDays();
  const p=PLAN[S.day],d=S.days[S.day];
  $("title").textContent=`Day ${S.day+1} · ${p.name}`;$("sub").textContent=p.sub;
  $("addform").hidden=!!p.rest&&!d.ex.length;
  if(p.rest&&!d.ex.length){$("list").innerHTML=`<div class="rest"><h3>${p.name} day</h3><p>${p.rest}</p><button class="btn" id="addanyway">Log a workout anyway</button></div>`;stats();return}
  $("list").innerHTML=d.ex.map((e,ei)=>`
   <article class="ex">
    <div class="exhead"><h3>${esc(e.name)}</h3><span class="target">${e.sets.length} × ${esc(e.target)}</span></div>
    ${e.last?`<div class="last">Last time: ${esc(e.last)} ${S.unit}</div>`:""}
    <table><thead><tr><th>Set</th><th>Weight (${S.unit})</th><th>Reps</th><th></th></tr></thead><tbody>
    ${e.sets.map((s,si)=>`<tr class="${s.done?"done":""}">
      <td class="n">${si+1}</td>
      <td><input type="number" inputmode="decimal" step="2.5" min="0" id="w-${S.day}-${ei}-${si}" data-e="${ei}" data-s="${si}" data-k="w" value="${s.w}" aria-label="Set ${si+1} weight"></td>
      <td><input type="number" inputmode="numeric" min="0" id="r-${S.day}-${ei}-${si}" data-e="${ei}" data-s="${si}" data-k="r" value="${s.r}" aria-label="Set ${si+1} reps"></td>
      <td><button class="chk" data-done="${ei}-${si}" aria-label="Mark set ${si+1} done">✓</button></td></tr>`).join("")}
    </tbody></table>
    <div class="row-actions">
      <button class="btn" data-addset="${ei}">+ Set</button>
      <button class="btn ghost" data-rmset="${ei}">− Set</button>
      <button class="btn ghost" data-rmex="${ei}">Remove</button>
    </div>
   </article>`).join("")+`<div class="row-actions"><button class="btn primary" id="finish">Finish workout</button></div>`;
  stats();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

$("days").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;S.day=+b.dataset.i;save();render();window.scrollTo({top:0})});
$("list").addEventListener("input",e=>{const t=e.target;if(!t.dataset.k)return;S.days[S.day].ex[t.dataset.e].sets[t.dataset.s][t.dataset.k]=t.value;save();stats()});
$("list").addEventListener("click",e=>{
  const d=S.days[S.day],t=e.target.closest("button");if(!t)return;
  if(t.dataset.done){const[a,b]=t.dataset.done.split("-");const s=d.ex[a].sets[b];s.done=!s.done;t.closest("tr").classList.toggle("done",s.done);save();stats();return}
  if(t.dataset.addset){const ex=d.ex[t.dataset.addset];const l=ex.sets[ex.sets.length-1]||{w:"",r:""};ex.sets.push({w:l.w,r:l.r,done:false})}
  else if(t.dataset.rmset){const ex=d.ex[t.dataset.rmset];if(ex.sets.length>1)ex.sets.pop()}
  else if(t.dataset.rmex){d.ex.splice(+t.dataset.rmex,1)}
  else if(t.id==="addanyway"){$("addform").hidden=false;$("list").innerHTML="";$("add-name").focus();return}
  else if(t.id==="finish"){
    let n=0;d.ex.forEach(ex=>{const done=ex.sets.filter(s=>s.done);if(done.length){const top=done.reduce((a,b)=>(+b.w>+a.w?b:a));ex.last=`${top.w} × ${top.r}`;n+=done.length}ex.sets.forEach(s=>s.done=false)});
    save();render();toast(n?`Saved ${n} sets. Ready for next week.`:"Mark at least one set done first.");return}
  save();render();
});
$("addform").addEventListener("submit",e=>{e.preventDefault();const n=$("add-name").value.trim();if(!n)return;
  const s=Math.max(1,Math.min(10,+$("add-sets").value||3)),r=$("add-reps").value.trim()||"10";
  S.days[S.day].ex.push({name:n,target:r,last:"",sets:Array.from({length:s},()=>({w:"",r:r.match(/^\d+/)?.[0]||"",done:false}))});
  $("add-name").value="";save();render();toast(`Added ${n}`)});
function setUnit(u){S.unit=u;$("u-lb").setAttribute("aria-pressed",u==="lb");$("u-kg").setAttribute("aria-pressed",u==="kg");save();render()}
$("u-lb").onclick=()=>setUnit("lb");$("u-kg").onclick=()=>setUnit("kg");
setUnit(S.unit);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
